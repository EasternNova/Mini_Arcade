<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Arcade</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">Mini Arcade</div>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#games">Games</a></li>
        <li><a href="#about">About</a></li>
        <li><button id="theme-toggle">Toggle Dark Mode</button></li>
      </ul>
    </nav>
  </header>

  <section id="home">
    <h1>Welcome to Mini Arcade</h1>
    <p>Play your favorite games all in one place!</p>
  </section>

  <section id="games" class="game-grid">
    <!-- Game cards inserted here -->
    <div class="game-card">
      <img src="your_path/candy/images/icon.png" alt="Candy Crush Icon" />
      <h3>Candy Crush</h3>
      <a href="candy/index.html" class="play-btn">Play Now</a>
    </div>
    <!-- Repeat for other games -->
  </section>

  <footer>
    <p>© 2025 Mini Arcade. Created by [Your Name].</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
